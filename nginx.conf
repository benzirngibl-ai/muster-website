server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Astro build.format=directory → /pfad/ = /pfad/index.html
  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;

  # robots.txt / llms.txt liegen als Build-Artefakte im dist (Astro-Endpoints)
  location = /robots.txt { default_type text/plain; }
  location = /llms.txt   { default_type text/plain; }

  # Cache: Assets mit Hash lange, HTML kurz
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=300";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 512;
}
