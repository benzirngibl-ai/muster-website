server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Astro build.format=directory → /pfad/ = /pfad/index.html
  #
  # Cache-Regel steht bewusst HIER und nicht in einem `location ~* \.html$`:
  # Astro liefert Verzeichnis-URLs, die Anfrage lautet "/" oder "/impressum/" und
  # endet nie auf .html. Ein Regex auf die Dateiendung matcht deshalb keine einzige
  # Seite — die Regel sah lange richtig aus und tat nichts. Ohne Cache-Control
  # raten Browser die Frische selbst (Faustregel 10 % des Dateialters), und
  # Wiederbesucher sahen nach einem Deploy tagelang die alte Seite.
  # no-cache heißt nicht "nicht speichern", sondern "vor Benutzung nachfragen" —
  # dank ETag ist das ein 304 mit ein paar Bytes.
  location / {
    try_files $uri $uri/index.html $uri/ =404;
    add_header Cache-Control "no-cache" always;
  }

  error_page 404 /404.html;

  # robots.txt / llms.txt liegen als Build-Artefakte im dist (Astro-Endpoints)
  location = /robots.txt { default_type text/plain; add_header Cache-Control "no-cache" always; }
  location = /llms.txt   { default_type text/plain; add_header Cache-Control "no-cache" always; }

  # Astro hängt allen gebündelten Assets einen Hash an den Namen — ändert sich der
  # Inhalt, ändert sich die URL. Die dürfen deshalb ewig liegen bleiben.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Bilder tragen KEINEN Hash: /images/team.webp bleibt /images/team.webp, auch wenn
  # ein anderes Foto dahinterliegt. Deshalb eine Stunde statt einem Jahr — lange
  # genug fürs Weiterklicken, kurz genug, dass ein Bildtausch nicht untergeht.
  location /images/ {
    add_header Cache-Control "public, max-age=3600" always;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 512;
}
